name: Météo-France live station ingestion
on:
  workflow_dispatch:
    inputs:
      from:
        description: First source daily date (empty means last seven archive days)
        type: string
      to:
        description: Last source daily date (inclusive)
        type: string
  schedule:
    - cron: '40 7 * * *'
permissions:
  contents: read
concurrency:
  group: meteofrance-station-ingestion
  cancel-in-progress: false
jobs:
  live:
    # Environment secrets are not automatically GitHub repository secrets.
    # Scheduling must be enabled deliberately after review/merge and configuration.
    if: github.event_name == 'workflow_dispatch' || vars.METEOFRANCE_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      METEOFRANCE_CLIMATOLOGY_API_KEY: ${{ secrets.METEOFRANCE_CLIMATOLOGY_API_KEY }}
      METEOFRANCE_OBSERVATIONS_API_KEY: ${{ secrets.METEOFRANCE_OBSERVATIONS_API_KEY }}
      PYTHONPATH: engine/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock
      - uses: actions/cache@v4
        with:
          path: work/meteofrance/raw-sources
          key: meteofrance-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: meteofrance-source-v1-
      - name: Qualified daily archive and correction window
        env:
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
        shell: bash
        run: |
          if [[ -n "$DATE_FROM" || -n "$DATE_TO" ]]; then
            python scripts/ingest_weather.py --mode live_meteofrance --root work/meteofrance --from "$DATE_FROM" --to "$DATE_TO"
          else
            python scripts/ingest_weather.py --mode live_meteofrance --root work/meteofrance --daily
          fi
      - name: Latest hourly samples, explicitly separate from daily aggregates
        run: python scripts/ingest_weather.py --mode live_meteofrance --product observations --root work/meteofrance --daily
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meteofrance-station-manifests
          path: work/meteofrance/manifests/
