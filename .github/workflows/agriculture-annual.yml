name: Agriculture annual source check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 15 7,11 *'
permissions:
  contents: read
concurrency:
  group: agriculture-annual-check
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check official catalogs only, without downloading parcel archives
        run: python scripts/agriculture_source_check.py --output work/agriculture-source-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agriculture-source-check
          path: work/agriculture-source-check.json
          retention-days: 30
