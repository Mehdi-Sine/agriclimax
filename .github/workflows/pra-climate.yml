name: Bounded PRA climate batch
on:
  # GitHub schedule is best-effort; supervision reports the observed launch delay.
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Existing bounded batch or incremental national DEV adapter
        type: choice
        options: [batch, daily-pilot, national-daily, operational-pilot, weather-preflight, weather-national, weather-masks, weather-coastal-review, weather-humidity-review, weather-health, era5-archive, daily-dev-check]
        default: batch
      daily_downloads:
        description: Maximum new source extents, 1 or 2 degrees (1 to 64); default four
        type: number
        default: 4
      dataset_version:
        description: Immutable explicit CDS source revision
        required: false
        type: string
      pra_ids:
        description: Comma separated stable PRA IDs (maximum 4; no automatic national selection)
        required: false
        type: string
      national_authorized:
        description: Separate operator authorization for bounded national processing (at most one new tile per job)
        default: false
        type: boolean
      from:
        description: First UTC date (default today minus five days)
        type: string
      to:
        description: Last UTC date for ERA batches; for weather modes optionally H00, H06, H12, H18
        type: string
      execute:
        description: Acquire a bounded real-data batch (otherwise plan only)
        default: false
        type: boolean
      publish_dev:
        description: Explicit authorization to publish a validated national weather cycle in DEV
        type: boolean
        default: false
      checkpoint_run_id:
        description: Optional previous run ID with pra-checkpoints artifact (same reference and revision)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pra-climate-batches
  cancel-in-progress: false
jobs:
  batch:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock
      - name: Resume compact checkpoints only
        if: inputs.checkpoint_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$CHECKPOINT_RUN_ID" --name pra-checkpoints --dir work/pra
      - name: Plan or execute one bounded batch (never deploys schema or writes Supabase)
        timeout-minutes: 25
        env:
          PYTHONPATH: engine/src
          CDSAPI_KEY: ${{ inputs.execute && secrets.CDSAPI_KEY || '' }}
          REFERENCE_DIRECTORY: config/coverage/ofb-masa-pra-2017-snapshot-20261017
          DATASET_VERSION: ${{ inputs.dataset_version }}
          PRA_IDS: ${{ inputs.pra_ids }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
          NATIONAL_AUTHORIZED: ${{ inputs.national_authorized }}
          EXECUTE_BATCH: ${{ inputs.execute }}
        run: |
          timeout --signal=TERM --kill-after=10s 24m python scripts/pra_workflow.py
      - name: Compact restart state; hourly NetCDF and source cache excluded
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pra-checkpoints
          path: |
            work/pra/batches/
            work/pra/tiles/
            work/pra/runs/
            work/pra/run.json
            work/pra/coverage.json
            work/pra/coverage.md
          retention-days: 7
          if-no-files-found: warn
  national-daily:
    # Deliberately no variable can enable scheduling before reviewed DEV acceptance.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily-pilot' || inputs.mode == 'national-daily')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock
      - name: Restore most recent compact checkpoints on this branch (bounded search)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/pra-daily
          if [[ -n "$CHECKPOINT_RUN_ID" ]]; then
            [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
            gh run download "$CHECKPOINT_RUN_ID" --name pra-daily-checkpoints --dir work/pra-daily
          else
            gh run list --workflow pra-climate.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId --jq '.[].databaseId' > work/prior-runs.txt
            while read -r previous; do
              [[ "$previous" == "$GITHUB_RUN_ID" ]] && continue
              if gh run download "$previous" --name pra-daily-checkpoints --dir work/pra-daily 2>/dev/null; then break; fi
            done < work/prior-runs.txt
          fi
          # One measured local pilot tile; never overwrite a restored checkpoint.
          cp -rn docs/codex/task26/pilot-checkpoints/tiles work/pra-daily/
      - name: Incremental DEV only; offline dry-run unless execute is checked
        timeout-minutes: 24
        env:
          PYTHONPATH: engine/src
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.execute && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ inputs.execute && secrets.SUPABASE_SECRET_KEY || '' }}
          CDSAPI_KEY: ${{ inputs.execute && secrets.CDSAPI_KEY || '' }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
          PILOT: ${{ inputs.mode == 'daily-pilot' }}
          MAX_DOWNLOADS: ${{ inputs.daily_downloads }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-downloads "$MAX_DOWNLOADS" --max-days 7)
          if [[ -n "$DATE_FROM" || -n "$DATE_TO" ]]; then args+=(--from "$DATE_FROM" --to "$DATE_TO"); fi
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          if [[ "$PILOT" == true ]]; then args+=(--pilot); fi
          timeout --signal=TERM --kill-after=15s 23m python scripts/national_daily_climate.py "${args[@]}"
      - name: Export only the requested recovery window without removing original checkpoints
        if: always()
        id: snapshot
        env:
          PYTHONPATH: engine/src
        run: python scripts/pra_checkpoint_snapshot.py
      - name: Preserve compact restart state even after timeout (no hourly or raw source cache)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pra-daily-checkpoints
          path: |
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/batches/
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/tiles/
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/state.json
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/run.json
          retention-days: 7
          if-no-files-found: warn

  operational-pilot:
    # Manual twelve-PRA capture only; never enables a national forecast schedule.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'operational-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Restore selected IFS ranges only after an explicit interrupted-run choice
        if: inputs.checkpoint_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$CHECKPOINT_RUN_ID" --name operational-pilot-recovery --dir work/operational-pilot
      - name: Capture one bounded real IFS cycle on twelve official PRA
        timeout-minutes: 22
        env:
          PYTHONPATH: engine/src
          RUN_DATE: ${{ inputs.from }}
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          args=(--run-date "$RUN_DATE")
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          timeout --signal=TERM --kill-after=10s 21m python scripts/operational_weather_pilot.py "${args[@]}"
      - name: Preserve verified compact cycle and index receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-pilot
          path: |
            work/operational-pilot/cycle.json
            work/operational-pilot/native.json.gz
            work/operational-pilot/native.json.sha256
            work/operational-pilot/native-manifest.json
            work/operational-pilot/*.index
            work/operational-pilot/*.sha256
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve selected byte ranges after interruption for explicit recovery
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-pilot-recovery
          path: work/operational-pilot/
          retention-days: 3
          if-no-files-found: warn

  national-weather:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'weather-preflight' || inputs.mode == 'weather-national' || inputs.mode == 'weather-masks' || inputs.mode == 'weather-coastal-review' || inputs.mode == 'weather-humidity-review' || (inputs.mode == 'daily-dev-check' && inputs.execute && inputs.national_authorized && inputs.publish_dev))) || (github.event_name == 'schedule' && vars.PRA_CLIMATE_DAILY_DEV_ENABLED == 'true' && vars.PRA_CLIMATE_DAILY_KILL_SWITCH != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-climate.lock -r engine/requirements-operational.lock
      - name: Restore verified weather checkpoints, never reacquire completed fields
        if: inputs.checkpoint_run_id != '' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.checkpoint_run_id }}
        run: python scripts/restore_daily_checkpoint.py weather work/national-weather
      - name: Bounded source preflight or authorized national cycle
        timeout-minutes: 23
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          WEATHER_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'daily-dev-check') && 'weather-national' || inputs.mode }}
          WEATHER_DATE: ${{ inputs.from }}
          WEATHER_HOUR: ${{ inputs.to }}
          DISCOVER_LATEST: ${{ github.event_name == 'schedule' }}
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
          AUTHORIZE_NATIONAL: ${{ github.event_name == 'schedule' || inputs.national_authorized }}
          PUBLISH_DEV: ${{ github.event_name == 'schedule' || inputs.publish_dev }}
          METEOFRANCE_AROME_API_KEY: ${{ (github.event_name == 'schedule' || inputs.execute) && secrets.METEOFRANCE_AROME_API_KEY || '' }}
          METEOFRANCE_ARPEGE_API_KEY: ${{ (github.event_name == 'schedule' || inputs.execute) && secrets.METEOFRANCE_ARPEGE_API_KEY || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ (github.event_name == 'schedule' || inputs.publish_dev || inputs.mode == 'weather-coastal-review') && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ (github.event_name == 'schedule' || inputs.publish_dev || inputs.mode == 'weather-coastal-review') && secrets.SUPABASE_SECRET_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "${WEATHER_MODE#weather-}" --root work/national-weather)
          if [[ "$DISCOVER_LATEST" == true ]]; then args+=(--latest-available); fi
          if [[ -n "$WEATHER_DATE" ]]; then args+=(--run-date "$WEATHER_DATE"); fi
          if [[ -n "$WEATHER_HOUR" ]]; then [[ "$WEATHER_HOUR" =~ ^H(00|06|12|18)$ ]]; args+=(--run-hour "$((10#${WEATHER_HOUR#H}))"); fi
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          if [[ "$AUTHORIZE_NATIONAL" == true ]]; then args+=(--national-authorized); fi
          if [[ "$PUBLISH_DEV" == true ]]; then args+=(--publish-dev); fi
          timeout --signal=TERM --kill-after=10s 22m python scripts/national_weather.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: national-weather-evidence
          path: |
            work/national-weather/preflight.json
            work/national-weather/report.json
            work/national-weather/comparison.json
            work/national-weather/publication.json
            work/national-weather/audits/
            work/national-weather/cycles/**/audits/
            work/national-weather/cycles/**/*.failure.json
            work/national-weather/official-land-masks.json
            work/national-weather/coastal-sensitivity.json
            work/national-weather/humidity-review.json
          retention-days: 30
      - name: Export only the selected weather cycle
        if: always()
        run: python scripts/weather_export_checkpoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: national-weather-checkpoints
          path: work/national-weather-export/
          retention-days: 3

  weather-health:
    needs: [national-weather, era5-archive, era5-resume-1, era5-resume-2]
    # Default-branch schedules only; off until independent DEV acceptance.
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'weather-health' || inputs.mode == 'daily-dev-check')) || (github.event_name == 'schedule' && (vars.PRA_WEATHER_DEV_HEALTH_ENABLED == 'true' || vars.PRA_CLIMATE_DAILY_DEV_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Read-only archive freshness and integrity
        env:
          PYTHONPATH: engine/src
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/pra_weather_health.py
      - name: Collect bounded workflow metadata and non-secret receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/daily-monitoring
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > work/daily-monitoring/run.json
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/pra-climate.yml/runs" -f branch="$GITHUB_REF_NAME" -f event=schedule -f per_page=20 --jq '.workflow_runs' > work/daily-monitoring/history.json
          for name in national-weather-evidence era5-archive-evidence era5-resume-1-evidence era5-resume-2-evidence; do
            gh run download "$GITHUB_RUN_ID" --name "$name" --dir "work/daily-monitoring/$name" || true
          done
      - name: Independent daily workflow and publication verdict
        if: always()
        env:
          PYTHONPATH: engine/src
          DAILY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/daily_monitoring.py
      - name: DATA-01 read-only archive continuity and freshness
        if: always()
        env:
          PYTHONPATH: engine/src:scripts
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/data01_daily.py --output work/daily-monitoring/archive-continuity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daily-monitoring
          path: |
            work/daily-monitoring/report.json
            work/daily-monitoring/archive-continuity.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: national-weather-health
          path: work/weather-health/report.json
          retention-days: 30

  era5-archive:
    needs: [national-weather]
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'era5-archive' || inputs.mode == 'daily-dev-check') && inputs.national_authorized) || (github.event_name == 'schedule' && vars.PRA_CLIMATE_DAILY_DEV_ENABLED == 'true' && vars.PRA_CLIMATE_DAILY_KILL_SWITCH != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Resume immutable archive-only checkpoints
        if: inputs.checkpoint_run_id != '' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.checkpoint_run_id }}
        run: |
          python scripts/restore_daily_checkpoint.py era5 work/era5-archive
      - name: New ERA5 day only, no database persistence
        timeout-minutes: 23
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          CDSAPI_KEY: ${{ (github.event_name == 'schedule' || inputs.execute) && secrets.CDSAPI_KEY || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ERA_DATE: ${{ inputs.mode != 'daily-dev-check' && inputs.from || '' }}
          REPLAY_LATEST: ${{ inputs.mode == 'daily-dev-check' }}
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish_dev }}
          MAX_DOWNLOADS: ${{ github.event_name == 'schedule' && '64' || inputs.daily_downloads }}
        run: |
          set -euo pipefail
          args=(--root work/era5-archive --max-downloads "$MAX_DOWNLOADS")
          if [[ -n "$ERA_DATE" ]]; then args+=(--date "$ERA_DATE"); fi
          if [[ "$REPLAY_LATEST" == true ]]; then args+=(--replay-latest); fi
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          if [[ "$PUBLISH" == true ]]; then args+=(--publish-dev); fi
          timeout --signal=TERM --kill-after=10s 22m python scripts/era5_archive_daily.py "${args[@]}"
      - name: Export only the current day, never accumulate prior raw grids
        if: always()
        run: python scripts/era5_export_checkpoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-archive-checkpoints
          path: work/era5-archive-export/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-archive-evidence
          path: work/era5-archive/report.json
          retention-days: 30

  era5-resume-1:
    needs: [era5-archive]
    if: always() && needs.era5-archive.result == 'failure' && github.event_name == 'schedule' && vars.PRA_CLIMATE_DAILY_DEV_ENABLED == 'true' && vars.PRA_CLIMATE_DAILY_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Resume the immediately preceding bounded stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name era5-archive-checkpoints --dir work/era5-archive
      - name: Continue one archive day without re-ingesting validated history
        timeout-minutes: 23
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: timeout --signal=TERM --kill-after=10s 22m python scripts/era5_archive_daily.py --root work/era5-archive --max-downloads 64 --resume --execute --publish-dev
      - name: Export only the current day, never accumulate prior raw grids
        if: always()
        run: python scripts/era5_export_checkpoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-resume-1-checkpoints
          path: work/era5-archive-export/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-resume-1-evidence
          path: work/era5-archive/report.json
          retention-days: 30

  era5-resume-2:
    needs: [era5-resume-1]
    if: always() && needs.era5-resume-1.result == 'failure' && github.event_name == 'schedule' && vars.PRA_CLIMATE_DAILY_DEV_ENABLED == 'true' && vars.PRA_CLIMATE_DAILY_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Resume the immediately preceding bounded stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name era5-resume-1-checkpoints --dir work/era5-archive
      - name: Continue one archive day without re-ingesting validated history
        timeout-minutes: 23
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: timeout --signal=TERM --kill-after=10s 22m python scripts/era5_archive_daily.py --root work/era5-archive --max-downloads 64 --resume --execute --publish-dev
      - name: Export only the current day, never accumulate prior raw grids
        if: always()
        run: python scripts/era5_export_checkpoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-resume-2-checkpoints
          path: work/era5-archive-export/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: era5-resume-2-evidence
          path: work/era5-archive/report.json
          retention-days: 30
