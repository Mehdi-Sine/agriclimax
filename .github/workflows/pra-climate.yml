name: Bounded PRA climate batch
on:
  # Registered but the national job below remains dispatch-only until DEV acceptance.
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Existing bounded batch or incremental national DEV adapter
        type: choice
        options: [batch, daily-pilot, national-daily, operational-pilot, weather-preflight, weather-national]
        default: batch
      daily_downloads:
        description: Maximum new source extents, 1 or 2 degrees (1 to 64); default four
        type: number
        default: 4
      reference_directory:
        description: Reviewed reference directory under config/coverage (manifest, reference and weights JSON)
        required: true
        default: config/coverage/ofb-masa-pra-2017-snapshot-20261017
        type: string
      dataset_version:
        description: Immutable explicit CDS source revision
        required: false
        type: string
      pra_ids:
        description: Comma separated stable PRA IDs (maximum 4; no automatic national selection)
        required: false
        type: string
      national_authorized:
        description: Separate operator authorization for bounded national processing (at most one new tile per job)
        default: false
        type: boolean
      from:
        description: First UTC date (default today minus five days)
        type: string
      to:
        description: Last UTC date (maximum seven-day batch windows; plan at most 90 days)
        type: string
      execute:
        description: Acquire a bounded real-data batch (otherwise plan only)
        default: false
        type: boolean
      publish_dev:
        description: Explicit authorization to publish a validated national weather cycle in DEV
        type: boolean
        default: false
      checkpoint_run_id:
        description: Optional previous run ID with pra-checkpoints artifact (same reference and revision)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pra-climate-batches
  cancel-in-progress: false
jobs:
  batch:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock
      - name: Resume compact checkpoints only
        if: inputs.checkpoint_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$CHECKPOINT_RUN_ID" --name pra-checkpoints --dir work/pra
      - name: Plan or execute one bounded batch (never deploys schema or writes Supabase)
        timeout-minutes: 25
        env:
          PYTHONPATH: engine/src
          CDSAPI_KEY: ${{ inputs.execute && secrets.CDSAPI_KEY || '' }}
          REFERENCE_DIRECTORY: ${{ inputs.reference_directory }}
          DATASET_VERSION: ${{ inputs.dataset_version }}
          PRA_IDS: ${{ inputs.pra_ids }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
          NATIONAL_AUTHORIZED: ${{ inputs.national_authorized }}
          EXECUTE_BATCH: ${{ inputs.execute }}
        run: |
          timeout --signal=TERM --kill-after=10s 24m python scripts/pra_workflow.py
      - name: Compact restart state; hourly NetCDF and source cache excluded
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pra-checkpoints
          path: |
            work/pra/batches/
            work/pra/tiles/
            work/pra/runs/
            work/pra/run.json
            work/pra/coverage.json
            work/pra/coverage.md
          retention-days: 7
          if-no-files-found: warn
  national-daily:
    # Deliberately no variable can enable scheduling before reviewed DEV acceptance.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily-pilot' || inputs.mode == 'national-daily')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock
      - name: Restore most recent compact checkpoints on this branch (bounded search)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/pra-daily
          if [[ -n "$CHECKPOINT_RUN_ID" ]]; then
            [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
            gh run download "$CHECKPOINT_RUN_ID" --name pra-daily-checkpoints --dir work/pra-daily
          else
            gh run list --workflow pra-climate.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId --jq '.[].databaseId' > work/prior-runs.txt
            while read -r previous; do
              [[ "$previous" == "$GITHUB_RUN_ID" ]] && continue
              if gh run download "$previous" --name pra-daily-checkpoints --dir work/pra-daily 2>/dev/null; then break; fi
            done < work/prior-runs.txt
          fi
          # One measured local pilot tile; never overwrite a restored checkpoint.
          cp -rn docs/codex/task26/pilot-checkpoints/tiles work/pra-daily/
      - name: Incremental DEV only; offline dry-run unless execute is checked
        timeout-minutes: 24
        env:
          PYTHONPATH: engine/src
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.execute && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ inputs.execute && secrets.SUPABASE_SECRET_KEY || '' }}
          CDSAPI_KEY: ${{ inputs.execute && secrets.CDSAPI_KEY || '' }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
          EXECUTE: ${{ inputs.execute }}
          PILOT: ${{ inputs.mode == 'daily-pilot' }}
          MAX_DOWNLOADS: ${{ inputs.daily_downloads }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-downloads "$MAX_DOWNLOADS" --max-days 7)
          if [[ -n "$DATE_FROM" || -n "$DATE_TO" ]]; then args+=(--from "$DATE_FROM" --to "$DATE_TO"); fi
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          if [[ "$PILOT" == true ]]; then args+=(--pilot); fi
          timeout --signal=TERM --kill-after=15s 23m python scripts/national_daily_climate.py "${args[@]}"
      - name: Export only the requested recovery window without removing original checkpoints
        if: always()
        id: snapshot
        env:
          PYTHONPATH: engine/src
        run: python scripts/pra_checkpoint_snapshot.py
      - name: Preserve compact restart state even after timeout (no hourly or raw source cache)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pra-daily-checkpoints
          path: |
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/batches/
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/tiles/
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/state.json
            ${{ steps.snapshot.outcome == 'success' && 'work/pra-daily-export' || 'work/pra-daily' }}/run.json
          retention-days: 7
          if-no-files-found: warn

  operational-pilot:
    # Manual twelve-PRA capture only; never enables a national forecast schedule.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'operational-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-operational.lock
      - name: Restore selected IFS ranges only after an explicit interrupted-run choice
        if: inputs.checkpoint_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$CHECKPOINT_RUN_ID" --name operational-pilot-recovery --dir work/operational-pilot
      - name: Capture one bounded real IFS cycle on twelve official PRA
        timeout-minutes: 22
        env:
          PYTHONPATH: engine/src
          RUN_DATE: ${{ inputs.from }}
          EXECUTE: ${{ inputs.execute }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          args=(--run-date "$RUN_DATE")
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          timeout --signal=TERM --kill-after=10s 21m python scripts/operational_weather_pilot.py "${args[@]}"
      - name: Preserve verified compact cycle and index receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-pilot
          path: |
            work/operational-pilot/cycle.json
            work/operational-pilot/native.json.gz
            work/operational-pilot/native.json.sha256
            work/operational-pilot/native-manifest.json
            work/operational-pilot/*.index
            work/operational-pilot/*.sha256
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve selected byte ranges after interruption for explicit recovery
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-pilot-recovery
          path: work/operational-pilot/
          retention-days: 3
          if-no-files-found: warn

  national-weather:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'weather-preflight' || inputs.mode == 'weather-national')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-climate.lock -r engine/requirements-operational.lock
      - name: Restore verified weather checkpoints, never reacquire completed fields
        if: inputs.checkpoint_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.checkpoint_run_id }}
        run: |
          [[ "$PREVIOUS_RUN" =~ ^[0-9]+$ ]]
          gh run download "$PREVIOUS_RUN" --name national-weather-checkpoints --dir work/national-weather
      - name: Bounded source preflight or authorized national cycle
        timeout-minutes: 23
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          WEATHER_MODE: ${{ inputs.mode }}
          WEATHER_DATE: ${{ inputs.from }}
          EXECUTE: ${{ inputs.execute }}
          AUTHORIZE_NATIONAL: ${{ inputs.national_authorized }}
          PUBLISH_DEV: ${{ inputs.publish_dev }}
          METEOFRANCE_AROME_API_KEY: ${{ inputs.execute && secrets.METEOFRANCE_AROME_API_KEY || '' }}
          METEOFRANCE_ARPEGE_API_KEY: ${{ inputs.execute && secrets.METEOFRANCE_ARPEGE_API_KEY || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.publish_dev && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ inputs.publish_dev && secrets.SUPABASE_SECRET_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "${WEATHER_MODE#weather-}" --root work/national-weather)
          if [[ -n "$WEATHER_DATE" ]]; then args+=(--run-date "$WEATHER_DATE"); fi
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          if [[ "$AUTHORIZE_NATIONAL" == true ]]; then args+=(--national-authorized); fi
          if [[ "$PUBLISH_DEV" == true ]]; then args+=(--publish-dev); fi
          timeout --signal=TERM --kill-after=10s 22m python scripts/national_weather.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: national-weather-evidence
          path: |
            work/national-weather/preflight.json
            work/national-weather/report.json
            work/national-weather/comparison.json
            work/national-weather/publication.json
            work/national-weather/audits/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: national-weather-checkpoints
          path: work/national-weather/
          retention-days: 7
