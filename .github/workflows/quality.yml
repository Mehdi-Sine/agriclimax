name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/quality/requirements.lock
      - run: mkdir -p work/quality
      - run: python -m coverage run --data-file=work/quality/.coverage --include='*/scripts/quality/security.py,*/scripts/quality/migrations.py,*/scripts/quality/budget.py' -m unittest discover -s tests/quality -p 'test_*.py' -v
      - run: python -m coverage report --data-file=work/quality/.coverage --fail-under=80
      - run: python scripts/quality/security.py
      - run: python scripts/quality/migrations.py
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Actionlint (verified release or checksum-verified Go module)
        shell: bash
        run: |
          bash scripts/quality/install-go-tool.sh actionlint work/actionlint
          work/actionlint/actionlint -shellcheck= .github/workflows/*.yml
      - name: Existing migrations are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/quality/migrations.py --base "$BASE_SHA"
      - run: node --test tests/quality/*.test.mjs
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -r engine/requirements-agriculture.lock -r engine/requirements-operational.lock -e 'engine[dev]'
      - run: python -m ruff check engine/src/agriclimax/agriculture scripts/agriculture*.py engine/tests/test_agriculture*.py
      - run: python scripts/agriculture_server_index.py --check
      - run: python scripts/agriculture_validate.py --require-national
      - run: python -m pip check
      - run: python -m ruff check scripts/quality tests/quality
      - run: python -m ruff check engine/src/agriclimax/climate engine/tests/climate scripts/ingest_climatology.py scripts/compare_climatology.py
      - run: python -m mypy --strict engine/src/agriclimax/climate scripts/ingest_climatology.py scripts/compare_climatology.py
      - run: python -m ruff check scripts/pra_climatology.py scripts/pra_climatology_acquire.py scripts/pra_climatology_annual.py scripts/pra_climatology_store.py scripts/pra_climatology_validate.py
      - run: MYPYPATH=engine/src python -m mypy --strict scripts/pra_climatology.py scripts/pra_climatology_acquire.py scripts/pra_climatology_annual.py scripts/pra_climatology_store.py scripts/pra_climatology_validate.py
      - run: python -m ruff check scripts/pra_climatology_compact.py scripts/pra_climatology_compact_store.py scripts/pra_climatology_compact_verify.py
      - run: MYPYPATH=engine/src python -m mypy --strict scripts/pra_climatology_compact.py scripts/pra_climatology_compact_store.py scripts/pra_climatology_compact_verify.py
      - run: python -m ruff check engine/src/agriclimax/wheat engine/tests/wheat scripts/compute_wheat.py scripts/export_wheat_schema.py scripts/bundle_wheat.py
      - run: python -m mypy --strict engine/src/agriclimax/wheat scripts/compute_wheat.py scripts/export_wheat_schema.py scripts/bundle_wheat.py
      - run: python -m ruff check scripts/backfill_france.py scripts/backfill_france_stations.py scripts/select_france_stations.py scripts/prepare_france_references.py
      - run: python -m mypy --strict engine/src/agriclimax/climate scripts/backfill_france.py scripts/backfill_france_stations.py scripts/select_france_stations.py scripts/prepare_france_references.py
      - run: python -m ruff check engine/src/agriclimax/cattle engine/tests/cattle scripts/cattle_heat_stress.py
      - run: python -m mypy --strict engine/src/agriclimax/cattle scripts/cattle_heat_stress.py
      - run: python -m ruff check engine/src/agriclimax/territories engine/tests/territories scripts/pra_reference.py scripts/pra_reference_sql.py scripts/pra_climate.py scripts/pra_workflow.py scripts/national_daily_climate.py scripts/operational_weather_pilot.py scripts/pra_real_pilot.py scripts/pra_ofb_prepare.py scripts/pra_compare_geometries.py scripts/pra_validate_pilot.py tests/e2e/pra_postgis_bridge.py tests/e2e/pra_stage_local.py
      - run: python -m ruff check scripts/pra_closure_audit.py
      - run: python -m ruff check scripts/pra_acceptance_review.py scripts/pra_migration_reconcile.py scripts/pra_pilot_sample.py scripts/pra_pilot_run.py scripts/pra_pilot_reference.py scripts/pra_pilot_review.py scripts/pra_30day_run.py scripts/pra_30day_review.py scripts/pra_30day_http.py scripts/pra_national_30day.py scripts/pra_national_review.py
      - run: MYPYPATH=engine/src python -m mypy --strict scripts/pra_acceptance_review.py scripts/pra_migration_reconcile.py scripts/pra_pilot_sample.py scripts/pra_pilot_run.py scripts/pra_pilot_reference.py scripts/pra_pilot_review.py scripts/pra_30day_run.py scripts/pra_30day_review.py scripts/pra_30day_http.py scripts/pra_national_30day.py scripts/pra_national_review.py
      - run: python -m mypy --strict engine/src/agriclimax/territories scripts/pra_reference.py scripts/pra_reference_sql.py scripts/pra_climate.py scripts/pra_workflow.py scripts/national_daily_climate.py scripts/operational_weather_pilot.py scripts/pra_real_pilot.py scripts/pra_closure_audit.py
      - run: python -m ruff check engine/src/agriclimax/ingestion/source_retry.py scripts/restore_daily_checkpoint.py scripts/weather_export_checkpoint.py scripts/daily_monitoring.py
      - run: MYPYPATH=engine/src:scripts python -m mypy --strict engine/src/agriclimax/ingestion/source_retry.py scripts/restore_daily_checkpoint.py scripts/weather_export_checkpoint.py scripts/daily_monitoring.py
      - run: python -m ruff check scripts/national_weather*.py scripts/pra_weather*.py scripts/verify_national_weather.py
      - run: python -m ruff check scripts/era5_*.py scripts/operational_land_masks.py scripts/coastal_model_review.py scripts/operational_humidity_review.py
      - run: MYPYPATH=engine/src:scripts python -m mypy --strict scripts/era5_*.py scripts/operational_land_masks.py scripts/coastal_model_review.py scripts/operational_humidity_review.py
      - run: MYPYPATH=engine/src:scripts python -m mypy --strict scripts/national_weather.py scripts/national_weather_sources.py scripts/national_weather_models.py scripts/national_weather_run.py scripts/pra_weather_store.py scripts/pra_weather_health.py scripts/verify_national_weather.py
      - run: python -m ruff check scripts/data01_daily.py scripts/data01_history.py scripts/data01_verify_product.py scripts/archive_legacy_pra_reads.py engine/tests/territories/test_data01_daily.py
      - run: MYPYPATH=engine/src:scripts python -m mypy --strict scripts/data01_daily.py scripts/data01_history.py scripts/data01_verify_product.py scripts/archive_legacy_pra_reads.py
      - run: python -m ruff check engine/src/agriclimax/editorial engine/tests/editorial scripts/task33_news_links.py scripts/task33_validate.py
      - run: MYPYPATH=engine/src python -m mypy --strict engine/src/agriclimax/editorial scripts/task33_news_links.py scripts/task33_validate.py
      - run: python scripts/check_contracts.py
      - run: python scripts/quality/check_automation.py
      - run: python -m pytest engine/tests --junitxml=work/quality/python.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-tests
          path: work/quality/python.xml
  web-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Synthetic tripwire, never a real cloud credential.
      QUALITY_SERVER_SENTINEL: quality-task09-tripwire
      SUPABASE_SECRET_KEY: quality-task09-tripwire
      SUPABASE_SERVICE_ROLE_KEY: quality-task09-tripwire
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm editorial:typecheck
      - run: pnpm editorial-ai:typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/quality/audit-exceptions.mjs --build
      - run: python scripts/quality/security.py --bundle apps/web/.next/static
      - run: python supabase/scripts/check_client_secrets.py
      - run: python scripts/quality/budget.py
      - name: Isolated browser tooling (exact versions, no product dependency change)
        run: npm ci --prefix tests/e2e --ignore-scripts
      - run: node tests/e2e/node_modules/playwright/cli.js install --with-deps chromium
      - name: Production demo smoke and browser checks
        shell: bash
        run: |
          mkdir -p work/quality
          pnpm --filter @agriclimax/web exec next start --hostname 127.0.0.1 >work/quality/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/quality/smoke.py
          TASK24_BASE_URL=http://127.0.0.1:3000 node tests/e2e/task24.mjs
          TASK35_ORIGIN=http://127.0.0.1:3000 TASK35_OUTPUT=work/quality/e2e/task35 node tests/e2e/task35.mjs
          node tests/e2e/demo.mjs
          node tests/e2e/territories.mjs
          INTEGRATION_ARTIFACTS=work/quality/e2e/integration node tests/e2e/integration.mjs
          WHEAT_ARTIFACTS=work/quality/e2e/wheat node tests/e2e/wheat.mjs
          DAILY_ARTIFACTS=work/quality/e2e/daily node tests/e2e/daily-risk.mjs
          E2E_DISCONNECTED_ONLY=1 E2E_UNAVAILABLE_BASE_URL=http://127.0.0.1:3000 E2E_LIVE_ARTIFACTS=work/quality/e2e/live node tests/e2e/live-risk.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-browser-report
          path: work/quality/e2e/
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        schema: [public, extensions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/quality/requirements.lock
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock
      - name: Task 04 migrations, RLS, RPC contracts and query plans
        env:
          SQL_SCHEMA: ${{ matrix.schema }}
          PYTHON: python
        run: bash supabase/tests/run-local.sh "$SQL_SCHEMA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sql-${{ matrix.schema }}
          path: work/task04-${{ matrix.schema }}/
