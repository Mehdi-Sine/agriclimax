name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/quality/requirements.lock
      - run: mkdir -p work/quality
      - run: python -m coverage run --data-file=work/quality/.coverage --include='*/scripts/quality/security.py,*/scripts/quality/migrations.py,*/scripts/quality/budget.py' -m unittest discover -s tests/quality -p 'test_*.py' -v
      - run: python -m coverage report --data-file=work/quality/.coverage --fail-under=80
      - run: python scripts/quality/security.py
      - run: python scripts/quality/migrations.py
      - name: Actionlint (pinned binary and checksum)
        shell: bash
        run: |
          mkdir -p work/actionlint
          curl --fail --location --silent --show-error -o work/actionlint/archive.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          cd work/actionlint
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  archive.tar.gz' | sha256sum --check
          tar -xzf archive.tar.gz actionlint
          cd ../..
          work/actionlint/actionlint -shellcheck= .github/workflows/*.yml
      - name: Existing migrations are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/quality/migrations.py --base "$BASE_SHA"
      - run: node --test tests/quality/*.test.mjs
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-climate.lock -r engine/requirements-geo.lock -e 'engine[dev]'
      - run: python -m pip check
      - run: python -m ruff check scripts/quality tests/quality
      - run: python -m ruff check engine/src/agriclimax/climate engine/tests/climate scripts/ingest_climatology.py scripts/compare_climatology.py
      - run: python -m mypy --strict engine/src/agriclimax/climate scripts/ingest_climatology.py scripts/compare_climatology.py
      - run: python -m ruff check engine/src/agriclimax/wheat engine/tests/wheat scripts/compute_wheat.py scripts/export_wheat_schema.py scripts/bundle_wheat.py
      - run: python -m mypy --strict engine/src/agriclimax/wheat scripts/compute_wheat.py scripts/export_wheat_schema.py scripts/bundle_wheat.py
      - run: python -m ruff check scripts/backfill_france.py scripts/backfill_france_stations.py scripts/select_france_stations.py scripts/prepare_france_references.py
      - run: python -m mypy --strict engine/src/agriclimax/climate scripts/backfill_france.py scripts/backfill_france_stations.py scripts/select_france_stations.py scripts/prepare_france_references.py
      - run: python -m ruff check engine/src/agriclimax/cattle engine/tests/cattle scripts/cattle_heat_stress.py
      - run: python -m mypy --strict engine/src/agriclimax/cattle scripts/cattle_heat_stress.py
      - run: python -m ruff check engine/src/agriclimax/territories engine/tests/territories scripts/pra_reference.py scripts/pra_reference_sql.py scripts/pra_climate.py scripts/pra_workflow.py scripts/pra_real_pilot.py scripts/pra_ofb_prepare.py scripts/pra_compare_geometries.py scripts/pra_validate_pilot.py tests/e2e/pra_postgis_bridge.py tests/e2e/pra_stage_local.py
      - run: python -m ruff check scripts/pra_closure_audit.py
      - run: python -m ruff check scripts/pra_acceptance_review.py scripts/pra_migration_reconcile.py
      - run: python -m mypy --strict scripts/pra_acceptance_review.py scripts/pra_migration_reconcile.py
      - run: python -m mypy --strict engine/src/agriclimax/territories scripts/pra_reference.py scripts/pra_reference_sql.py scripts/pra_climate.py scripts/pra_workflow.py scripts/pra_real_pilot.py scripts/pra_closure_audit.py
      - run: python scripts/check_contracts.py
      - run: python scripts/quality/check_automation.py
      - run: python -m pytest engine/tests --junitxml=work/quality/python.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-tests
          path: work/quality/python.xml
  web-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Synthetic tripwire, never a real cloud credential.
      QUALITY_SERVER_SENTINEL: quality-task09-tripwire
      SUPABASE_SECRET_KEY: quality-task09-tripwire
      SUPABASE_SERVICE_ROLE_KEY: quality-task09-tripwire
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/quality/audit-exceptions.mjs --build
      - run: python scripts/quality/security.py --bundle apps/web/.next/static
      - run: python supabase/scripts/check_client_secrets.py
      - run: python scripts/quality/budget.py
      - name: Isolated browser tooling (exact versions, no product dependency change)
        run: npm ci --prefix tests/e2e --ignore-scripts
      - run: node tests/e2e/node_modules/playwright/cli.js install --with-deps chromium
      - name: Production demo smoke and browser checks
        shell: bash
        run: |
          mkdir -p work/quality
          pnpm --filter @agriclimax/web exec next start --hostname 127.0.0.1 >work/quality/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/quality/smoke.py
          node tests/e2e/demo.mjs
          node tests/e2e/territories.mjs
          INTEGRATION_ARTIFACTS=work/quality/e2e/integration node tests/e2e/integration.mjs
          WHEAT_ARTIFACTS=work/quality/e2e/wheat node tests/e2e/wheat.mjs
          DAILY_ARTIFACTS=work/quality/e2e/daily node tests/e2e/daily-risk.mjs
          E2E_DISCONNECTED_ONLY=1 E2E_UNAVAILABLE_BASE_URL=http://127.0.0.1:3000 E2E_LIVE_ARTIFACTS=work/quality/e2e/live node tests/e2e/live-risk.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-browser-report
          path: work/quality/e2e/
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        schema: [public, extensions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/quality/requirements.lock
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock
      - name: Task 04 migrations, RLS, RPC contracts and query plans
        env:
          SQL_SCHEMA: ${{ matrix.schema }}
          PYTHON: python
        run: bash supabase/tests/run-local.sh "$SQL_SCHEMA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sql-${{ matrix.schema }}
          path: work/task04-${{ matrix.schema }}/
