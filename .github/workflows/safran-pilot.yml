name: COUV-01 bounded SAFRAN pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pra-climate-batches
  cancel-in-progress: false
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-safran.lock
      - name: Public source only; no database or publication credentials
        env:
          PYTHONPATH: engine/src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: timeout --signal=TERM --kill-after=10s 22m python scripts/safran_pilot.py --acquire
      - name: Preserve only compact PRA results and checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: couv01-safran-pra
          path: work/couv01/pilot/
          retention-days: 7
          if-no-files-found: warn
