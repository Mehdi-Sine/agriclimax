name: T36 operational nightly Journal
on:
  schedule:
    - cron: '15,45 2-4 * * *'
      timezone: Europe/Paris
    - cron: '15 5 * * *'
      timezone: Europe/Paris
    - cron: '40 5 * * *'
      timezone: Europe/Paris
    - cron: '30,45 6 * * *'
      timezone: Europe/Paris
    - cron: '0 7 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [acquire, prepare, preflight, qualify, run, report]
        default: report
        description: Explicit operational stage; run may make one reserved paid call
      authorized_snapshot:
        type: string
        description: Exact frozen snapshot ID authorizing one manual paid trial, maximum EUR 0.15
        required: false
      model:
        type: choice
        options: [gpt-6.1-terra, gpt-6-luna]
        default: gpt-6.1-terra
permissions:
  contents: read
  actions: read
concurrency:
  group: t36-nightly-${{ github.event.inputs.stage || github.event.schedule }}
  cancel-in-progress: false
jobs:
  plan:
    if: (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) || (github.event_name == 'schedule' && vars.AGRICLIMAX_NIGHTLY_ENABLED == 'true' && vars.AGRICLIMAX_NIGHTLY_KILL_SWITCH != 'true')
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.clock.outputs.stage }}
    steps:
      - id: clock
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Paris')).strftime('%H:%M')
          stage=os.environ.get('REQUESTED_STAGE') or ('acquire' if '02:15'<=now<'05:25' else 'run' if '05:40'<=now<'06:30' else 'report')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('stage='+stage+'\n')
          PY
      - name: Repository acquisition bindings and switches, metadata only
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          METEOFRANCE_CLIMATOLOGY_API_KEY: ${{ secrets.METEOFRANCE_CLIMATOLOGY_API_KEY }}
          METEOFRANCE_OBSERVATIONS_API_KEY: ${{ secrets.METEOFRANCE_OBSERVATIONS_API_KEY }}
          METEOFRANCE_AROME_API_KEY: ${{ secrets.METEOFRANCE_AROME_API_KEY }}
          METEOFRANCE_ARPEGE_API_KEY: ${{ secrets.METEOFRANCE_ARPEGE_API_KEY }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          NIGHTLY_ENABLED: ${{ vars.AGRICLIMAX_NIGHTLY_ENABLED }}
          NIGHTLY_KILL_SWITCH: ${{ vars.AGRICLIMAX_NIGHTLY_KILL_SWITCH }}
          AI_ENABLED: ${{ vars.AGRICLIMAX_AI_ENABLED }}
          PUBLICATION_ENABLED: ${{ vars.AGRICLIMAX_PUBLICATION_ENABLED }}
        run: |
          python - <<'PYTHON'
          import os,json
          names=['NEXT_PUBLIC_SUPABASE_URL','SUPABASE_SECRET_KEY','METEOFRANCE_CLIMATOLOGY_API_KEY','METEOFRANCE_OBSERVATIONS_API_KEY','METEOFRANCE_AROME_API_KEY','METEOFRANCE_ARPEGE_API_KEY','CDSAPI_KEY']
          print(json.dumps({'repository_bindings_present':{n:bool(os.environ.get(n)) for n in names},'switches':{n:os.environ.get(n)=='true' for n in ['NIGHTLY_ENABLED','NIGHTLY_KILL_SWITCH','AI_ENABLED','PUBLICATION_ENABLED']}}))
          PYTHON
  acquire:
    needs: plan
    if: needs.plan.outputs.stage == 'acquire'
    strategy:
      fail-fast: false
      matrix:
        source: [forecast, era5, stations, observations, news]
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-climate.lock -r engine/requirements-operational.lock
      - name: Claim shared lease, acquire only missing data, qualify and checkpoint
        env:
          AGRICLIMAX_CHECKPOINT_OWNER: t36
          PYTHONPATH: engine/src:scripts
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          METEOFRANCE_CLIMATOLOGY_API_KEY: ${{ secrets.METEOFRANCE_CLIMATOLOGY_API_KEY }}
          METEOFRANCE_OBSERVATIONS_API_KEY: ${{ secrets.METEOFRANCE_OBSERVATIONS_API_KEY }}
          METEOFRANCE_AROME_API_KEY: ${{ secrets.METEOFRANCE_AROME_API_KEY }}
          METEOFRANCE_ARPEGE_API_KEY: ${{ secrets.METEOFRANCE_ARPEGE_API_KEY }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          OPENBLAS_NUM_THREADS: '1'
          SOURCE: ${{ matrix.source }}
        run: python scripts/task36_nightly.py --source "$SOURCE"
      - name: Export bounded climate recovery files
        if: always() && (matrix.source == 'forecast' || matrix.source == 'era5')
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          if [ "$SOURCE" = forecast ]; then python scripts/weather_export_checkpoint.py; else python scripts/era5_export_checkpoint.py; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (matrix.source == 'forecast' || matrix.source == 'era5')
        with:
          name: t36-${{ matrix.source }}-checkpoints
          path: ${{ matrix.source == 'forecast' && 'work/national-weather-export/' || 'work/era5-archive-export/' }}
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t36-${{ matrix.source }}-logs
          path: work/task36/logs/
          retention-days: 21
  editorial:
    needs: plan
    if: needs.plan.outputs.stage != 'acquire'
    runs-on: ubuntu-latest
    environment: editorial-ai-dev
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock
      - name: Frozen dossier, reserved generation, validated archive or independent report
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGRICLIMAX_AI_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'run' && inputs.authorized_snapshot != '' && 'true' || vars.AGRICLIMAX_AI_ENABLED }}
          AGRICLIMAX_PUBLICATION_ENABLED: ${{ github.event_name == 'schedule' && vars.AGRICLIMAX_PUBLICATION_ENABLED || 'false' }}
          AGRICLIMAX_EDITORIAL_MODEL: ${{ inputs.model || vars.AGRICLIMAX_EDITORIAL_MODEL || 'gpt-6-luna' }}
          AGRICLIMAX_JOURNAL_HEALTH_URL: ${{ vars.AGRICLIMAX_JOURNAL_HEALTH_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGE: ${{ needs.plan.outputs.stage }}
          AUTHORIZED_SNAPSHOT: ${{ inputs.authorized_snapshot }}
        run: |
          args=("$STAGE")
          if [[ -n "$AUTHORIZED_SNAPSHOT" ]]; then args+=(--authorize-snapshot "$AUTHORIZED_SNAPSHOT"); fi
          pnpm editorial:nightly "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t36-editorial-${{ github.run_id }}
          path: work/task36/receipt.json
          retention-days: 21
