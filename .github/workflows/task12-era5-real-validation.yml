name: Task12 ERA5 real validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  validate-era5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Task 12 branch
        uses: actions/checkout@v4
        with:
          ref: codex/12-climatology-anomalies

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r engine/requirements-dev.lock \
            -r engine/requirements-climate.lock \
            -e "engine[dev,climate]"

      - name: Check CDS secret
        run: |
          python - <<'PY'
          import os
          import cdsapi
          import xarray as xr

          token = os.environ["CDSAPI_KEY"]

          request = {
              "product_type": "reanalysis",
              "variable": ["2m_temperature", "total_precipitation"],
              "year": "1991",
              "month": "09",
              "day": ["01", "02", "03", "04"],
              "time": [f"{h:02}:00" for h in range(24)],
              "area": [48.8, -5.0, 48.2, -4.2],
              "data_format": "netcdf",
              "download_format": "unarchived",
          }

          client = cdsapi.Client(
              url="https://cds.climate.copernicus.eu/api",
              key=token,
              quiet=True,
              debug=False,
              timeout=60,
          )

          target = "era5-real.nc"
          client.retrieve("reanalysis-era5-land", request, target)

          ds = xr.open_dataset(target, engine="netcdf4")

          print("ERA5_REAL_FILE_OK")
          print("dims:", dict(ds.sizes))
          print("variables:", list(ds.data_vars))
          print("coords:", list(ds.coords))

          for name in ds.data_vars:
              print(
                  "var:",
                  name,
                  "dims=",
                  ds[name].dims,
                  "units=",
                  ds[name].attrs.get("units"),
              )

          print("latitude_range:", float(ds.latitude.min()), float(ds.latitude.max()))
          print("longitude_range:", float(ds.longitude.min()), float(ds.longitude.max()))

          ds.close()
          PY
          
      - name: Climate tests
        run: |
          python -m pytest engine/tests/climate -v
