name: Task12 ERA5 real validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  validate-era5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Task 12 branch
        uses: actions/checkout@v4
        with:
          ref: codex/12-climatology-anomalies

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r engine/requirements-dev.lock \
            -r engine/requirements-climate.lock \
            -e "engine[dev,climate]"

      - name: Check CDS secret
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          test -n "$CDSAPI_KEY"

      - name: Diagnose CDS access safely
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          python - <<'PY'
          import os
          import cdsapi

          token = os.environ["CDSAPI_KEY"]

          request = {
              "product_type": "reanalysis",
              "variable": ["2m_temperature"],
              "year": "1991",
              "month": "09",
              "day": ["01"],
              "time": ["00:00"],
              "area": [48.8, -5.0, 48.2, -4.2],
              "data_format": "netcdf",
              "download_format": "unarchived",
          }

          try:
              client = cdsapi.Client(
                  url="https://cds.climate.copernicus.eu/api",
                  key=token,
                  quiet=False,
                  debug=False,
                  timeout=60,
              )
              client.retrieve(
                  "reanalysis-era5-land",
                  request,
                  "era5-test.nc",
              )
              print("CDS_DIAGNOSTIC_OK")
          except Exception as exc:
              message = str(exc).replace(token, "***REDACTED***")
              print("CDS_DIAGNOSTIC_FAILED")
              print(type(exc).__name__)
              print(message)
              raise SystemExit(1)
          PY

      - name: Climate tests
        run: |
          python -m pytest engine/tests/climate -v
