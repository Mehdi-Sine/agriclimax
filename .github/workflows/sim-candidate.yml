name: SAFRAN SIM private candidate
on:
  schedule:
    - cron: '7 3 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sim-candidate:
    # Independent from ERA and editorial dependencies; one writer for the whole transaction.
    if: vars.AGRICLIMAX_SIM_CANDIDATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sim-candidate-private-persistence
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: engine/src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: admission
        name: Admit one collection per Paris date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          AGRICLIMAX_EDITION_DATE=$(TZ=Europe/Paris date -d "$created" +%F)
          export AGRICLIMAX_EDITION_DATE
          echo "AGRICLIMAX_EDITION_DATE=$AGRICLIMAX_EDITION_DATE" >> "$GITHUB_ENV"
          python - <<'PYTHON'
          import os
          from task36_nightly import rpc
          admitted = rpc('sim_claim', {'edition_date': os.environ['AGRICLIMAX_EDITION_DATE'],
                                       'workflow_run_id': os.environ['GITHUB_RUN_ID']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'admitted={str(admitted).lower()}\n')
          PYTHON
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.admission.outputs.admitted == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/requirements-dev.lock
            engine/requirements-geo.lock
            engine/requirements-safran.lock
      - if: steps.admission.outputs.admitted == 'true'
        run: python -m pip install -r engine/requirements-dev.lock -r engine/requirements-geo.lock -r engine/requirements-safran.lock
      - name: Restore private candidate independently of Actions retention
        if: steps.admission.outputs.admitted == 'true'
        run: |
          mkdir -p work/couv04/receipts
          python scripts/couv04_checkpoint.py restore --root work/couv04/sim-candidate | tee work/couv04/receipts/restore.json
      - name: Collect only actual available SIM days
        if: steps.admission.outputs.admitted == 'true'
        run: python scripts/couv03_collect.py --root work/couv04/sim-candidate | tee work/couv04/receipts/collect.json
      - name: Persist bounded private snapshot with verified readback
        if: steps.admission.outputs.admitted == 'true'
        run: python scripts/couv04_checkpoint.py save --root work/couv04/sim-candidate | tee work/couv04/receipts/save.json
      - name: Verify recovery from private storage
        if: steps.admission.outputs.admitted == 'true'
        run: python scripts/couv04_checkpoint.py restore --root work/couv04/recovery-check | tee work/couv04/receipts/readback.json
      - name: Record the existing SIM receipts for the admin report
        if: always() && steps.admission.outputs.admitted == 'true'
        run: python scripts/admin_report_sim.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.admission.outputs.admitted == 'true'
        with:
          name: sim-persistence-receipts-${{ github.run_id }}
          path: work/couv04/receipts/
          retention-days: 21
