name: AgriclimaX daily live pipeline
on:
  workflow_dispatch:
    inputs:
      from:
        description: First UTC archive date (both dates or neither; maximum seven days)
        type: string
      to:
        description: Last UTC archive date (default yesterday, with seven-day correction window)
        type: string
  schedule:
    - cron: '40 7 * * *'
permissions:
  contents: read
concurrency:
  # Shared with the old manual ingestion workflow to avoid overlapping source writes.
  group: meteofrance-station-ingestion
  cancel-in-progress: false
jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || vars.AGRICLIMAX_DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-dev.lock
      - name: Ingest, validate, persist, compute and publish
        timeout-minutes: 25
        env:
          PYTHONPATH: engine/src
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          METEOFRANCE_CLIMATOLOGY_API_KEY: ${{ secrets.METEOFRANCE_CLIMATOLOGY_API_KEY }}
          DATE_FROM: ${{ inputs.from }}
          DATE_TO: ${{ inputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/daily/logs
          args=()
          if [[ -n "$DATE_FROM" || -n "$DATE_TO" ]]; then
            args+=(--from "$DATE_FROM" --to "$DATE_TO")
          fi
          timeout --signal=TERM --kill-after=10s 24m python scripts/daily_live.py "${args[@]}" 2>&1 | tee work/daily/logs/console.log
      - name: Non-secret receipts and stage logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/daily/logs/
            work/daily/snapshot.json
          retention-days: 30
          if-no-files-found: warn
