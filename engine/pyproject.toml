[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agriclimax-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.11,<2", "ruff>=0.6,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/agriclimax"]
