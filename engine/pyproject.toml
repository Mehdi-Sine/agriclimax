[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agriclimax-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "mypy>=1.11,<2", "ruff>=0.6,<1", "jsonschema>=4.23,<5"]
geo = ["shapely==2.1.2", "pyproj==3.7.2"]
climate = ["cdsapi==0.7.7", "xarray==2026.9.0", "netCDF4==1.7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/agriclimax"]
