[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agriclimax-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
